# Laptop test: open http://localhost:8080  (no access code, no HTTPS)
services:
  bridge:
    build: .
    image: pulse-sim
    ports:
      - "8080:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - ACCESS_CODE=
    # Live code from this folder: after `git pull`, restart with `up --no-build` (no rebuild needed)
    volumes:
      - ./web:/app/web:ro
      - ./bridge:/app/bridge:ro
    restart: unless-stopped
